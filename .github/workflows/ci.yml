name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dprint with mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: dprint hk gitleaks github:crate-ci/committed
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - name: Cache Rust builds with mr-boxington
        uses: jdx/mr-boxington-action@9df1d4b18b2147788a7ee7a2c7b84ecf62fd89d3 # v1.5.0
        with:
          version: 1.17.0
          toolchain: '1.98.1'
      - name: Check Rust and protocol tests
        run: |
          cargo +1.98.1 fmt --all -- --check
          dprint check
          mbx +1.98.1 clippy --locked --all-targets --features test-fixture -- -D warnings
          mbx +1.98.1 test --locked --all-targets --features test-fixture
