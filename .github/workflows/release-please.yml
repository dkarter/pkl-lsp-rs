name: Release Please

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Confirm main has not moved
        id: current
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/main
          if [[ "$TRIGGER_SHA" == "$(git rev-parse FETCH_HEAD)" ]]; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - name: Create app token for CI-triggering release PRs
        if: ${{ steps.current.outputs.yes == 'true' }}
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare draft release
        if: ${{ steps.current.outputs.yes == 'true' }}
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}

  build:
    if: ${{ needs.release-please.outputs.created == 'true' }}
    needs: release-please
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              runner: ubuntu-24.04,
              target: x86_64-unknown-linux-musl,
              os: linux,
              arch: x86_64,
              ext: '',
              archive: tar.gz,
            }
          - {
              runner: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-musl,
              os: linux,
              arch: arm64,
              ext: '',
              archive: tar.gz,
            }
          - {
              runner: macos-15,
              target: aarch64-apple-darwin,
              os: darwin,
              arch: arm64,
              ext: '',
              archive: tar.gz,
            }
          - {
              runner: windows-2025,
              target: x86_64-pc-windows-msvc,
              os: windows,
              arch: x86_64,
              ext: .exe,
              archive: zip,
            }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - name: Verify tag points to release commit
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-parse "${TAG}^{commit}")" = "$SHA"
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup +1.98.1 target add ${{ matrix.target }}
      - name: Restore Rust build cache
        uses: jdx/mr-boxington-action@9df1d4b18b2147788a7ee7a2c7b84ecf62fd89d3 # v1.5.0
        with:
          version: 1.17.0
          toolchain: '1.98.1'
      - name: Install musl linker
        if: ${{ matrix.os == 'linux' }}
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build
        shell: bash
        run: mbx +1.98.1 build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          ARCHIVE: ${{ matrix.archive }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir -p dist/package
          cp "target/${TARGET}/release/pkl-lsp-rs${EXT}" dist/package/
          cp README.md LICENSE dist/package/
          cp -R THIRD_PARTY_LICENSES dist/package/
          asset="dist/pkl-lsp-rs_${VERSION}_${OS}_${ARCH}.${ARCHIVE}"
          if [[ "$ARCHIVE" == zip ]]; then
            (cd dist/package && 7z a "../$(basename "$asset")" ./*)
          else
            tar -C dist/package -czf "$asset" .
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Attest native binary archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" "$ASSET"

  publish:
    if: ${{ needs.release-please.outputs.created == 'true' }}
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish only after all binaries and attestations succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
